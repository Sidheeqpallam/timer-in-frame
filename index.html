<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Timer</title>
<style>
  @font-face { font-family: "DSEG7"; src: url("fonts/DSEG7Classic-Regular.woff2") format("woff2"); font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #eee; font: 14px system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; gap: 10px; align-items: center;
         flex-wrap: wrap; padding: 8px 12px; background: #141414; border-bottom: 1px solid #333; }
  #bar.hide { display: none; }
  button, input, select, label { font: inherit; }
  button { padding: 5px 12px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; cursor: pointer; }
  button:hover { background: #363636; }
  input[type=text], input[type=color] { width: 90px; padding: 4px 6px; background: #1e1e1e; color: #eee; border: 1px solid #444; border-radius: 6px; }
  #stage { position: fixed; inset: 0; background: #000; }
  .box { position: absolute; }
  #timerBox { z-index: 1; display: flex; align-items: center; justify-content: center; }
  #frameBox { z-index: 2; }
  #frameBox img { width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; }
  #time { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
          font-family: "DSEG7", "Courier New", monospace; }
  /* the 7-segment face has its own weight; synthetic bold fuses the segments */
  #time.seg { font-weight: 400; }
  .active { outline: 1px dashed #4af; }
  .inactive { pointer-events: none; }
  .grip { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; background: #4af;
          border-radius: 4px; cursor: nwse-resize; }
  .box.inactive .grip { display: none; }
  #hint { position: fixed; bottom: 6px; left: 8px; z-index: 10; color: #666; font-size: 12px; }
</style>

<div id="bar">
  <input id="dur" type="text" value="05:00" title="mm:ss or hh:mm:ss">
  <button id="start">Start</button>
  <button id="reset">Reset</button>
  <label>Move: <select id="mode"><option value="timer">Timer</option><option value="frame">Frame</option></select></label>
  <label>Frame: <input id="file" type="file" accept="image/*"></label>
  <label>Font: <select id="font">
    <option value='"DSEG7", monospace'>Digital (7-segment)</option>
    <option value="system-ui, sans-serif">Sans</option>
    <option value='"Courier New", monospace'>Mono</option>
    <option value="Georgia, serif">Serif</option>
  </select></label>
  <input id="color" type="color" value="#ffffff" title="Timer colour">
  <button id="full">Fullscreen</button>
  <button id="hideBar">Hide bar (H)</button>
</div>

<div id="stage">
  <div class="box" id="timerBox"><div id="time" class="seg">05:00</div><div class="grip"></div></div>
  <div class="box" id="frameBox"><img id="frameImg" src="frame.svg" alt=""><div class="grip"></div></div>
</div>
<div id="hint">H = hide bar · F = fullscreen · Space = start/pause</div>

<script>
const $ = s => document.querySelector(s);
const timerBox = $('#timerBox'), frameBox = $('#frameBox'), timeEl = $('#time');

// initial layout: frame centred, timer inside it
const W = innerWidth || 1280, H = innerHeight || 720;
place(frameBox, (W - 800) / 2, (H - 600) / 2, 800, 600);
place(timerBox, (W - 520) / 2, (H - 200) / 2, 520, 200);

function place(el, x, y, w, h) {
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  if (el === timerBox) fitText();
}
// font size follows the box, shrunk further if the text is too wide (hh:mm:ss)
function fitText() {
  const h = timerBox.offsetHeight, w = timerBox.offsetWidth;
  timeEl.style.fontSize = h * 0.8 + 'px';
  const over = timeEl.offsetWidth / (w * 0.95);
  if (over > 1) timeEl.style.fontSize = (h * 0.8) / over + 'px';
}

/* ---- drag + resize ---- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const box = e.target.closest('.box');
  if (!box || box.classList.contains('inactive')) return;
  drag = { box, resize: e.target.classList.contains('grip'), x: e.clientX, y: e.clientY,
           left: box.offsetLeft, top: box.offsetTop, w: box.offsetWidth, h: box.offsetHeight };
  box.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.resize) place(drag.box, drag.left, drag.top, Math.max(60, drag.w + dx), Math.max(40, drag.h + dy));
  else place(drag.box, drag.left + dx, drag.top + dy, drag.w, drag.h);
});
document.addEventListener('pointerup', () => drag = null);

function setMode(m) {
  if (running) m = 'none';
  timerBox.classList.toggle('inactive', m !== 'timer');
  frameBox.classList.toggle('inactive', m !== 'frame');
  timerBox.classList.toggle('active', m === 'timer');
  frameBox.classList.toggle('active', m === 'frame');
}
$('#mode').onchange = () => applyMode();
const applyMode = () => setMode($('#mode').value);

/* ---- timer ---- */
let total = 300, left = 300, running = false, endAt = 0;

function parse(s) {
  const p = s.trim().split(':').map(Number);
  if (p.some(n => !Number.isFinite(n) || n < 0)) return null;
  return p.reduce((a, n) => a * 60 + n, 0);
}
function fmt(sec) {
  const neg = sec < 0; sec = Math.abs(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return (neg ? '-' : '') + (h ? h + ':' : '') + pad(m) + ':' + pad(s);
}
function render() {
  timeEl.textContent = fmt(left);
  timeEl.style.color = left < 0 ? '#ff3b30' : $('#color').value;
  fitText();
}
// setInterval, not rAF: browsers freeze rAF when the tab/window is not visible
setInterval(() => {
  if (!running) return;
  left = Math.round((endAt - Date.now()) / 1000);
  render();
}, 250);
$('#start').onclick = () => {
  if (running) { running = false; $('#start').textContent = 'Start'; applyMode(); return; }
  const d = parse($('#dur').value);
  if (left === total && d !== null) { total = left = d; }      // picked up a new duration
  endAt = Date.now() + left * 1000;
  running = true; $('#start').textContent = 'Pause';
  applyMode(); render();
};
$('#reset').onclick = () => {
  const d = parse($('#dur').value);
  if (d === null) { alert('Use mm:ss or hh:mm:ss'); return; }
  running = false; $('#start').textContent = 'Start'; total = left = d; applyMode(); render();
};
$('#color').oninput = render;
$('#font').onchange = e => {
  timeEl.style.fontFamily = e.target.value;
  timeEl.classList.toggle('seg', e.target.value.includes('DSEG7'));
  fitText();
};

/* ---- frame image, fullscreen, keys ---- */
$('#file').onchange = e => {
  const f = e.target.files[0];
  if (f) $('#frameImg').src = URL.createObjectURL(f);
};
$('#full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('#hideBar').onclick = () => $('#bar').classList.add('hide');
addEventListener('keydown', e => {
  if (e.target.matches('input, select')) return;
  if (e.key === 'h' || e.key === 'H') $('#bar').classList.toggle('hide');
  if (e.key === 'f' || e.key === 'F') $('#full').click();
  if (e.key === ' ') { e.preventDefault(); $('#start').click(); }
});

applyMode(); render();

/* ---- self-check ---- */
console.assert(parse('5:00') === 300 && parse('1:02:03') === 3723 && parse('x') === null, 'parse');
console.assert(fmt(59) === '00:59' && fmt(3723) === '1:02:03' && fmt(-5) === '-00:05', 'fmt');
</script>
