<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Timer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Full-screen countdown timer inside a picture frame, for LED TV displays.">
<meta property="og:type" content="website">
<meta property="og:title" content="Frame Timer">
<meta property="og:description" content="Full-screen countdown timer inside a picture frame, for LED TV displays.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">

<div id="bar">
  <input id="dur" type="text" value="05:00" title="mm:ss or hh:mm:ss">
  <button id="start">Start</button>
  <button id="reset">Reset</button>
  <label>Move: <select id="mode"><option value="timer">Timer</option><option value="frame">Frame</option></select></label>
  <label><input id="showFrame" type="checkbox" checked> Frame</label>
  <label>Image: <input id="file" type="file" accept="image/*"></label>
  <label>Font: <select id="font">
    <option value='"DSEG7", monospace'>Digital (7-segment)</option>
    <option value="system-ui, sans-serif">Sans</option>
    <option value='"Courier New", monospace'>Mono</option>
    <option value="Georgia, serif">Serif</option>
  </select></label>
  <label>Text <input id="color" type="color" value="#ffc800"></label>
  <label>BG <input id="bg" type="color" value="#000000"></label>
  <label>Weight: <select id="bold">
    <option value="700" selected>Bold</option>
    <option value="400">Regular</option>
    <option value="300">Light</option>
  </select></label>
  <button id="full">Fullscreen</button>
  <button id="hideBar">Hide bar (H)</button>
</div>

<div id="stage">
  <div class="box" id="timerBox"><div id="time">05:00</div><div class="grip"></div></div>
  <div class="box" id="frameBox"><img id="frameImg" src="frame.svg" alt=""><div class="grip"></div></div>
</div>
<div id="hint">H = hide bar · F = fullscreen · Space = start/pause</div>

<script src="app.js"></script>
